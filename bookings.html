<main class="booking-container">
        <form class="booking-form">
            <h2>Book an Appointment</h2>

            <div class="form-group">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="Fname" placeholder="Enter your first name" required>
            </div>

            <div class="form-group">
                <label for="sname">Surname</label>
                <input type="text" id="sname" name="Sname" placeholder="Enter your surname" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="Email" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label for="btime">Date & Time for Booking</label>
                <input type="datetime-local" id="btime" name="BookingTime" required>
            </div>

            <div class="form-group">
                <label for="reason">Reason for Booking</label>
                <textarea id="reason" name="Reason" rows="4" placeholder="Briefly explain your reason..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Confirm Booking</button>
        </form>
    </main>
</body>
